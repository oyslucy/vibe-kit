[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-kit"
version = "0.1.0"
description = "Automate the initial setup of vibe-coding projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vibe = "vibe_kit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_kit"]

# Bundle kit assets so a non-editable install still works.
[tool.hatch.build.targets.wheel.force-include]
"global" = "vibe_kit/_assets/global"
"hooks" = "vibe_kit/_assets/hooks"
"skills" = "vibe_kit/_assets/skills"
"templates" = "vibe_kit/_assets/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
